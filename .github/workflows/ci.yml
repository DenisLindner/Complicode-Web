name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      APP_URL: http://localhost:3001
      API_URL: http://localhost:3000/api
      INTERNAL_API_KEY: ci-internal-key-with-at-least-32-chars
      SESSION_SECRET: ci-session-secret-with-at-least-32-chars
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
